<svg xmlns="http://www.w3.org/2000/svg" width="590" height="312" viewBox="0 0 590 312" role="img" aria-labelledby="t"><title id="t">RuleDost: Paste a hackathon's rules and get the real deadline in your time zone, whether you can enter, and what to submit, with every answer backed by the exact sentence from the rules. Fully offline.</title><style>@font-face{font-family:'Geist Mono mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.f-mono{font-family:'Geist Mono mono','Geist Mono',system-ui,sans-serif;font-weight:400;font-style:normal}@font-face{font-family:'Geist Mono mono-m';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.f-mono-m{font-family:'Geist Mono mono-m','Geist Mono',system-ui,sans-serif;font-weight:500;font-style:normal}@font-face{font-family:'Geist sans';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.f-sans{font-family:'Geist sans','Geist',system-ui,sans-serif;font-weight:400;font-style:normal}@font-face{font-family:'Geist sans-m';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.f-sans-m{font-family:'Geist sans-m','Geist',system-ui,sans-serif;font-weight:500;font-style:normal}@font-face{font-family:'Instrument Serif serif';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.f-serif{font-family:'Instrument Serif serif','Instrument Serif',system-ui,sans-serif;font-weight:400;font-style:normal}.rv{animation:rv 1s cubic-bezier(.2,.7,.1,1) both}@keyframes rv{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.fd{animation:fd 1.1s ease both}@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style><rect x="0" y="0" width="590" height="312" rx="26" fill="#161311" stroke="#2B2521"/><g class="fd" style="animation-delay:.1s"><text x="40" y="56" class="f-mono-m" font-size="12" fill="#FF7A3D" letter-spacing="1.8">BUILD WITH AI: BASICS 2026</text><circle class="pulse" cx="378.1" cy="52" r="3.5" fill="#FF7A3D"/><circle cx="378.1" cy="52" r="3.5" fill="#FF7A3D"/><text x="550" y="56" class="f-mono" font-size="11.5" fill="#8F8680" text-anchor="end" letter-spacing="1.6">NEW  ·  13 OCT 2026</text></g><g class="rv" style="animation-delay:.15s"><text x="38" y="122" class="f-serif" font-size="46" fill="#F4F1EE" letter-spacing="-0.8">RuleDost</text></g><g class="rv" style="animation-delay:.25s"><text x="40" y="160" class="f-sans" font-size="16.5" fill="#C7BFB9">Paste a hackathon's rules and get the real deadline in your time</text><text x="40" y="185" class="f-sans" font-size="16.5" fill="#C7BFB9">zone, whether you can enter, and what to submit, with every</text><text x="40" y="210" class="f-sans" font-size="16.5" fill="#C7BFB9">answer backed by the exact sentence from the rules. Fully offline.</text></g><line x1="40" y1="234" x2="550" y2="234" stroke="#2B2521"/><g class="fd" style="animation-delay:.4s"><g><rect x="40" y="250" width="96.7" height="28" rx="14.0" fill="none" stroke="#3A322D" stroke-width="1"/><text x="51" y="268.32" class="f-mono" font-size="12" fill="#8F8680" letter-spacing="0.3">TypeScript</text></g><text x="510" y="268.5" class="f-mono-m" font-size="11.5" fill="#8F8680" text-anchor="end" letter-spacing="1.6">LIVE + SOURCE</text><circle cx="534" cy="264" r="16" fill="#FF7A3D"/><text x="534" y="270" class="f-sans-m" font-size="16" fill="#170B05" text-anchor="middle">↗</text></g></svg>