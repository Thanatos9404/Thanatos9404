<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-labelledby="t"><title id="t">New on GitHub, picked up automatically</title><style>@font-face{font-family:'Geist Mono mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}.f-mono{font-family:'Geist Mono mono','Geist Mono',system-ui,sans-serif;font-weight:400;font-style:normal}@font-face{font-family:'Geist Mono mono-m';src:url(data:font/woff2;base64,) format('woff2');font-weight:500;font-style:normal}.f-mono-m{font-family:'Geist Mono mono-m','Geist Mono',system-ui,sans-serif;font-weight:500;font-style:normal}.ln{transform-box:fill-box;transform-origin:left center;animation:ln 1.6s cubic-bezier(.2,.7,.1,1) .05s both}@keyframes ln{from{transform:scaleX(0)}to{transform:none}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style><rect class="ln" x="0" y="14" width="1200" height="1" fill="#2B2521"/><text x="0" y="50" font-size="12.5" letter-spacing="2.2"><tspan class="f-mono-m" fill="#FF7A3D">NEW ON GITHUB</tspan><tspan class="f-mono" fill="#8F8680">  ·  PICKED UP AUTOMATICALLY</tspan></text><text x="1200" y="50" class="f-mono" font-size="12" fill="#8F8680" text-anchor="end" letter-spacing="2">LAST 60 DAYS</text></svg>