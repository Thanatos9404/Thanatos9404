name: Refresh live sections

on:
  schedule:
    # Every 15 minutes: a cheap check (5 API calls) that only triggers the rebuild when a PR was opened,
    # merged or closed, a public repo was created, or LLMSlim shipped a release. Every 4 hours the rebuild
    # runs regardless, to refresh contributions, downloads and stars.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml", ".github/contrib-3d.json"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fingerprint.py
            assets/live.json
          sparse-checkout-cone-mode: false

      - name: Did anything change?
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(date -u +%H); minute=$(date -u +%M)
          if [ $((10#$hour % 4)) -eq 0 ] && [ $((10#$minute)) -lt 15 ]; then
            echo "Periodic full refresh"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          result=$(python3 scripts/fingerprint.py --check || echo changed)
          echo "Fingerprint: $result"
          if [ "$result" = "same" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  refresh:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D contribution calendar. yoshi389111/github-profile-3d-contrib (MIT), pinned to the v0.9.3
      # commit so an upstream change can never alter what runs here. Palette: .github/contrib-3d.json
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/contrib-3d.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools==4.61.1 brotli==1.2.0 pillow==11.3.0

      - name: Pull live data (PRs, merges, contributions, PyPI, new repos)
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python refresh.py

      - name: Rebuild every SVG and the README from content.py + live.json
        working-directory: scripts
        run: |
          python build.py > /dev/null
          python readme.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh live sections"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
