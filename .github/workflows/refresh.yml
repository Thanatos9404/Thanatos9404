name: Refresh live sections

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml", ".github/contrib-3d.json"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D contribution calendar. yoshi389111/github-profile-3d-contrib (MIT), pinned to the v0.9.3
      # commit so an upstream change can never alter what runs here. Palette: .github/contrib-3d.json
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/contrib-3d.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools==4.61.1 brotli==1.2.0 pillow==11.3.0

      - name: Pull live data (PRs, merges, contributions, PyPI, new repos)
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python refresh.py

      - name: Rebuild every SVG and the README from content.py + live.json
        working-directory: scripts
        run: |
          python build.py > /dev/null
          python readme.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh live sections"
            git push
          fi
